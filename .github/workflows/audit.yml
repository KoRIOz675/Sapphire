name: Audit

# Known vulnerabilities in dependencies. Runs when a lockfile changes, and
# weekly, since new advisories are published without any change on our side.
on:
  pull_request:
    paths: [package-lock.json, src-tauri/Cargo.lock, .github/workflows/audit.yml]
  push:
    branches: [main]
    paths: [package-lock.json, src-tauri/Cargo.lock, .github/workflows/audit.yml]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit

      # Fails on vulnerabilities. Unmaintained/unsound/yanked crates are
      # reported as warnings (glib, zvariant... come from Tauri's Linux stack).
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

  npm-audit:
    name: npm audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Runtime dependencies only: build tools don't ship in the app.
      - name: npm audit
        run: npm audit --omit=dev
