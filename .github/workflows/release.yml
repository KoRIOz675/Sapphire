name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    # A manual run must be started from a version tag too: releases are only
    # ever built from a tag, never from a branch.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # create the draft release and upload installers
      id-token: write # build provenance attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows x64
            os: windows-latest
          - name: Linux x64
            # Oldest supported LTS runner: AppImages built against a newer
            # glibc don't start on older distros.
            os: ubuntu-22.04

    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # The tag must match the app version: the release is named after the
      # version in tauri.conf.json.
      - name: Check tag matches version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version v${version}" >&2
            exit 1
          fi

      # No build cache here: released binaries are always built from scratch.
      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Install npm deps
        run: npm ci

      # Bundle targets come from tauri.conf.json (msi/nsis on Windows,
      # deb/appimage on Linux). Both matrix jobs upload to the same draft
      # release; publish it by hand once the notes are written.
      - name: Build and upload to draft release
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Sapphire v__VERSION__
          releaseBody: |
            See the assets below to download Sapphire:

            - **Windows:** `.msi` or `.exe` (setup)
            - **Linux:** `.deb` (Debian/Ubuntu) or `.AppImage` (any distro)

            Installers are not code-signed yet, so Windows SmartScreen may warn on first launch ("More info" → "Run anyway").
            Check a download against the `SHA256SUMS-*.txt` file of its platform, or with `gh attestation verify <file> --repo KoRIOz675/Sapphire`.
          releaseDraft: true
          prerelease: false
          args: -- --locked

      - name: Checksums
        id: sums
        shell: bash
        env:
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
          PLATFORM: ${{ runner.os }}
        run: |
          node -e '
            const fs = require("fs"), crypto = require("crypto"), path = require("path");
            const files = JSON.parse(process.env.ARTIFACTS).filter((f) => fs.statSync(f).isFile());
            const sums = files.map((f) =>
              crypto.createHash("sha256").update(fs.readFileSync(f)).digest("hex") + "  " + path.basename(f));
            fs.writeFileSync(`SHA256SUMS-${process.env.PLATFORM}.txt`, sums.join("\n") + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "files<<EOF\n" + files.join("\n") + "\nEOF\n");
          '
          cat "SHA256SUMS-${PLATFORM}.txt"

      - name: Upload checksums to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
          PLATFORM: ${{ runner.os }}
        run: |
          gh api --method POST \
            -H "Content-Type: text/plain" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=SHA256SUMS-${PLATFORM}.txt" \
            --input "SHA256SUMS-${PLATFORM}.txt"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.sums.outputs.files }}
