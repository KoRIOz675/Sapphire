name: Feature request
description: Suggest an idea or an improvement for Sapphire.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and what gets in the way. Ex. "I'm always frustrated when [...]"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      description: A clear and concise description of the solution you'd like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Other solutions or workarounds you've tried or thought about.

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Screenshots, mock-ups or examples from other apps. Please hide any personal data.
