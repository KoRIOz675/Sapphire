name: Bug report
description: Something in Sapphire doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        **Sapphire holds personal information about your contacts.** Please don't paste real names, emails, phone numbers or notes in this issue, and blur them in screenshots.
        Found a security problem? Don't open an issue: see [SECURITY.md](https://github.com/KoRIOz675/Sapphire/blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we make it happen again?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Sapphire version
      description: Shown in Settings, under "About".
      placeholder: e.g. 0.1.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. Windows 11 24H2, Ubuntu 24.04, Fedora 44

  - type: dropdown
    id: install
    attributes:
      label: How did you install Sapphire?
      options:
        - Windows installer (.msi)
        - Windows setup (.exe)
        - Debian/Ubuntu package (.deb)
        - AppImage
        - Built from source
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Screenshots, error messages or anything else
      description: Error messages shown by the app help a lot. Remember to hide personal data.
